name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore WpfPilotMcp.sln

      - name: Build
        run: dotnet build WpfPilotMcp.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test WpfPilotMcp.sln --configuration Release --no-build

      - name: Publish self-contained win-x64
        run: dotnet publish src/WpfPilot.Mcp.Server/WpfPilot.Mcp.Server.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false --output artifacts/wpfpilot-mcp-win-x64

      - name: Rename executable
        shell: pwsh
        run: |
          Rename-Item -Path artifacts/wpfpilot-mcp-win-x64/WpfPilot.Mcp.Server.exe -NewName wpfpilot-mcp.exe
          Remove-Item -Path artifacts/wpfpilot-mcp-win-x64/*.pdb -Force

      - name: Zip win-x64
        shell: pwsh
        run: Compress-Archive -Path artifacts/wpfpilot-mcp-win-x64/* -DestinationPath artifacts/wpfpilot-mcp-win-x64.zip -Force

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wpfpilot-mcp-artifacts
          path: artifacts/

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/wpfpilot-mcp-win-x64.zip
